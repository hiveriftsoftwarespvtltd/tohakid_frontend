<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="tohayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A7A" />
      <stop offset="100%" stop-color="#C2185B" />
    </linearGradient>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#880E4F" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect x="16" y="16" width="480" height="480" rx="140" fill="url(#tohayBg)" filter="url(#shadow)"/>

  <!-- Border Ring -->
  <rect x="24" y="24" width="464" height="464" rx="132" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="12"/>

  <!-- Crown Emblem at Top -->
  <path d="M196 160L232 200L256 144L280 200L316 160L304 220H208L196 160Z" fill="url(#crownGold)"/>
  <circle cx="196" cy="152" r="10" fill="#FFE082"/>
  <circle cx="256" cy="136" r="12" fill="#FFE082"/>
  <circle cx="316" cy="152" r="10" fill="#FFE082"/>

  <!-- Bold Central "T" Letterform -->
  <path d="M160 236H352V288H284V404H228V288H160V236Z" fill="#FFFFFF"/>

  <!-- Sparkle Star Accent -->
  <path d="M370 120L376 138L394 144L376 150L370 168L364 150L346 144L364 138L370 120Z" fill="#FFE082"/>
</svg>